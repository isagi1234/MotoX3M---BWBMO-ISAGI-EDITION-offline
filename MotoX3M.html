<html lang="en">

<head>
    <meta charset="utf-8" />

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"> 
    <script src="prevent-keys.js"></script>
    
    <!-- تعطيل IMA SDK تماماً -->
    <script>
        // تعطيل IMA SDK قبل تحميله
        window.ima = {
            AdDisplayContainer: function() {},
            AdsLoader: function() {},
            AdsManager: function() {},
            AdsRenderingSettings: function() {},
            AdsRequest: function() {},
            AdErrorEvent: { Type: {} },
            AdEvent: { Type: {} },
            ViewMode: { NORMAL: '' },
            CompanionAd: function() {},
            CompanionAdSelectionSettings: function() {},
            UIElement: function() {},
            AdPodInfo: function() {},
            Ad: function() {}
        };
        window.google = window.google || {};
        window.google.ima = window.ima;
        
        // تعطيل Y8 Ads
        window.Y8Ads = {
            init: function() { return true; },
            showAd: function() { return true; }
        };
        
        console.log('✅ IMA SDK disabled');
    </script>
</head>

<body>
    <div id="content"></div>
    <div id="orientation"></div>
    <div id="loader">Loading ...</div>
    
    <!-- جميع الملفات في نفس المجلد -->
    <script type="text/javascript" src="nape.min.js"></script>
    <script type="text/javascript" src="jquery-3.1.1.min.js"></script>
    <script type="text/javascript" src="easeljs-0.8.2.combined.js"></script>
    <script type="text/javascript" src="bluebird.min.js"></script>
    <script type="text/javascript" src="phaser.min.js"></script>
    <script type="text/javascript" src="phaser-cachebuster.min.js"></script>
    <script type="text/javascript" src="phaser-super-storage.min.js"></script>
    <script type="text/javascript" src="dragonBones.min.js"></script>

    <script type="text/javascript">
        var useEvents = (typeof(Event) === 'function');

        var myDispatchEvent = function (name){
            var event;
            if (useEvents){
                event =  new Event(name);
            }else{
                event = document.createEvent('Event');
                event.initEvent(name, true, true);
            }
            document.getElementById("content").dispatchEvent(event);
        }
        
        window.idAsyncInit = function() {
            console.log("idAsyncInit");
            console.log(ID);
            console.log(ID.initialized);
            ID.Event.subscribe('id.init', function() {
                console.log("id.init ditpatch");
                ID.ads.init('87599');
                myDispatchEvent('sdk_inited');
            });

            ID.init({
                appId : '5589660dbbddbda74200026a'
            });
        };

        // تحميل SDK
        (function(d, s, id){
            var js, fjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) {return;}
            js = d.createElement(s); js.id = id;
            js.src = "sdk.js";
            fjs.parentNode.insertBefore(js, fjs);
        }(document, 'script', 'id-jssdk'));
    </script>

    <!-- تعطيل AdSense -->
    <script>
        window.adsbygoogle = window.adsbygoogle || [];
        window.adsbygoogle.push = function() {
            console.log('🚫 Ad blocked');
            return true;
        };
        console.log('✅ Ads disabled');
    </script>

    <script async
        data-ad-client="ca-pub-6129580795478709"
        data-ad-channel="5831288908"
        data-ad-frequency-hint="180s" 
        src="adsbygoogle.js">
    </script>

    <script type="text/javascript" src="gameBreakBeta.js"></script>
    
    <!-- إصلاح خطأ bike11 -->
    <script>
        // إنشاء البيانات المفقودة قبل تحميل اللعبة
        window.__gameAssets = {
            cars_game: {
                bike11: { x: 0, y: 0, w: 50, h: 50 }
            }
        };
        console.log('✅ Bike11 data created');
    </script>
    
    <script type="text/javascript" src="motox3m.min.js"></script>
</body>

</html>
